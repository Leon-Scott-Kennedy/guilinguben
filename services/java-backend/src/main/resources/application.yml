server:
  port: 8080

ai-service:
  base-url: http://localhost:8001
  # 内部 API Key（预留，D 轮 16.40）：配置非空时 Java 转发请求自动携带 X-Api-Key 头，
  # 与 Python 端 AI_SERVICE_API_KEY 可选校验配对启用；当前为空 = 不启用（本机开发）
  api-key: ""

# JWT 配置（D 轮 16.40）：无状态登录态
jwt:
  # HS256 密钥：必须 ≥32 字节；生产应从环境变量/密钥管理注入，不可入代码库
  secret: guilinguben-jwt-secret-2026-demo-0123456789abcdef
  # access token 有效期（小时）：过期后前端收 401 自动回登录页重新登录
  expiration-hours: 24
  # refresh token 有效期（天，预留）：当前仅签发 access token；
  # 后续“静默续期”时复用 JwtUtil.generateToken 的参数化 TTL 签发 refresh token，无需新增代码路径
  refresh-expiration-days: 7

spring:
  application:
    name: guilinguben-java-backend
  datasource:
    # 必须用 127.0.0.1 而非 localhost：Windows 上 JVM 优先解析 localhost 为 IPv6 ::1，
    # 而 ::1:5432 被 wslrelay（WSL 转发）占用会撞进 WSL 里的另一个 postgres 导致密码认证失败；
    # 127.0.0.1 直达 Docker 端口映射（com.docker.backend → 容器）
    url: jdbc:postgresql://127.0.0.1:5432/guilinguben
    username: guilinguben
    password: 123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379
      # 连接/读写超时保持短（2s）：Redis 不可用时快速失败并 fail-open，不拖慢核心链路
      timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
